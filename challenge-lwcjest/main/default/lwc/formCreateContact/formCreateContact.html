<template>
    <h1>Create Contact</h1>
    <form action="#" class="form" onsubmit={handleCreateContact}>
        <label for="FirstName">First Name</label>
        <input name="FirstName" type="text">
        <label for="LastName">Last Name</label>
        <input name="LastName" type="text">

        <section></section>
        <lightning-input 
          type="checkbox"
          label="Associate Account?"
          name="associate-account-bool"
          onchange={getAccountsForComboBox}
          value={associateAccount}
       
        ></lightning-input>
        <template lwc:if={accounts}>
            <label>Account
                <lightning-combobox
                  message-when-value-missing="Optional message to be displayed when no checkbox is selected and the required attribute is set."
                  name="Account"
                  placeholder="Select Account"
                  options={accounts}
                  value={selectedAccount}
                  onchange={handleComboBoxChange} 
                  variant="standard"
                ></lightning-combobox>
    
            </label>

        </template>
        <button class="submit-form" type="submit">Submit</button>

    </form>
</template>
